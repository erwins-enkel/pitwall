name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing draft release tag to (re)build binaries for, e.g. v0.2.1"
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    # Only the push-to-main path maintains the release PR / cuts releases.
    # A workflow_dispatch is a build-only re-run and must skip this job.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Creates the GitHub Release as a DRAFT (draft: true in the config), so the
      # build job can attach assets before the release is published and frozen by
      # GitHub's immutable-releases feature.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4, 2026-07-05
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Resolve the tag + commit to build, for both the release and the manual-rebuild
  # paths. A draft release has no git tag ref yet, so we build from the release's
  # commit SHA rather than checking out the tag.
  prepare:
    needs: release-please
    # The !cancelled() wrapper is required: without it, the skipped release-please
    # need (on workflow_dispatch) would skip this job and kill the manual re-run path.
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RP_TAG: ${{ needs.release-please.outputs.tag_name }}
          PUSH_SHA: ${{ github.sha }}
          IN_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$IN_TAG"
            # Guard: an already-published release is immutable — assets cannot be added.
            if [ "$(gh release view "$tag" --json isDraft -q .isDraft)" != "true" ]; then
              echo "::error::Release $tag is already published (immutable); assets cannot be (re)uploaded." >&2
              exit 1
            fi
            sha="$(gh release view "$tag" --json targetCommitish -q .targetCommitish)"
          else
            tag="$RP_TAG"
            sha="$PUSH_SHA"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4, 2026-07-05
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master, 2026-07-05
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      # Uploads to the existing DRAFT release via `gh release upload <tag>`, which
      # matches by tag_name and works even though the git tag ref does not exist yet.
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1, 2026-07-05
        with:
          bin: pitwall
          target: ${{ matrix.target }}
          archive: pitwall-$target
          checksum: sha256
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Publish the draft only after every target uploaded successfully. Publishing
  # creates the git tag and (with immutable releases enabled) freezes the release
  # with all assets attached. If any target failed, this is skipped and the draft
  # stays mutable for a workflow_dispatch re-run.
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
