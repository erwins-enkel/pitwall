name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-07.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-07-04
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2, 2026-07-04
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --locked

  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-07.0.1
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.82.8, 2026-07-03
        with:
          tool: cargo-machete
      - name: machete
        run: cargo machete

  commits:
    # Lint only the commits introduced by the PR against Conventional Commits.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-07.0.1
        with:
          fetch-depth: 0
      - name: install cocogitto
        # Pinned prebuilt binary (cocogitto 7.0.0, 2026-03-04) — no source compile.
        run: |
          mkdir -p "$RUNNER_TEMP/cog"
          curl -sSL https://github.com/cocogitto/cocogitto/releases/download/7.0.0/cocogitto-7.0.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --strip-components=1 -C "$RUNNER_TEMP/cog" x86_64-unknown-linux-musl/cog
          echo "$RUNNER_TEMP/cog" >> "$GITHUB_PATH"
      - name: check commit messages
        run: |
          cog --version
          cog check ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
