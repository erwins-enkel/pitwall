[package]
name = "pitwall"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
futures-util = "0.3"
libc = "0.2"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
bollard = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
humantime = "2"
toml = "1.1.2"

[profile.release]
strip = true
lto = true
