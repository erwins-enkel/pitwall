# pitwall config — copy to ~/.config/pitwall/config.toml (or point PITWALL_CONFIG
# at it) and edit. Every key below is optional and resolved env → file → default
# (first wins); an env var always overrides the matching file key. Unknown keys
# are a hard error, so only the keys shown here are valid.

# The one key you must set: your self-hosted runners' repo (owner/repo). Leaving
# it at pitwall's built-in "owner/repo" sentinel polls nothing and shows a "set
# PITWALL_REPO" hint, so set it here (or via PITWALL_REPO).
repo = "your-org/your-repo"

# repo may be one repo or several — a comma-separated string or an array:
#   repo = "your-org/your-repo, your-org/another-repo"
#   repo = ["your-org/your-repo", "your-org/another-repo"]

# Rootless Docker socket. Default: $DOCKER_HOST (unix:// stripped) if set, else
# /run/user/$UID/docker.sock. TOML does no $UID expansion — if you uncomment
# this, replace $UID with your numeric UID (`id -u`). Left commented, pitwall
# auto-detects it.
# socket = "/run/user/$UID/docker.sock"

# Runner container-name prefix to match (e.g. "pulse-ci-runner-"). Default below.
# prefix = "ci-runner-"

# Multiple fleets: prefix may be an array of { match, repo } tables. A mapped repo
# resolves that fleet's job/branch detail (and is auto-added to the poll list). The
# first prefix inherits the first configured `repo` when its `repo` is omitted; any
# other unmapped fleet shows CPU/mem but stays idle. The docker memory gauge sums
# ALL matched fleets under one slice_cap_gib.
# prefix = [
#   { match = "pulse-ci-runner-",     repo = "your-org/your-repo" },
#   { match = "flowagent-ci-runner-", repo = "your-org/another-repo" },
# ]
# Env equivalent: PITWALL_PREFIX="pulse-ci-runner-=your-org/your-repo,flowagent-ci-runner-=your-org/another-repo"

# Docker (pulse-slice) memory gauge cap, in GiB. Default below.
# slice_cap_gib = 24

# Catppuccin flavor: mocha, macchiato, frappe, or latte (light). Unknown values
# fall back to mocha. Default below.
# theme = "mocha"

# Note: the memory warn/critical percents are env-only — set PITWALL_MEM_WARN_PCT
# (default 85) and PITWALL_MEM_CRIT_PCT (default 90). They have no config-file key;
# adding one here would be an unknown-key error.
